<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password Generator</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script type="module" src="app.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
    <link rel="icon" href="static/favicon.ico" sizes="32x32" />
    <link rel="icon" href="static/icon.svg" type="image/svg+xml" />
    <link rel="icon" sizes="180x180" href="static/180.png" />
    <link rel="apple-touch-icon" href="static/180.png" />
    <link rel="manifest" href="static/pwa-manifest.json" />
  </head>
  <body class="min-vh-100 d-flex align-items-center">
    <main class="container-md text-center" style="max-width: 720px">
      <div class="row">
        <img src="static/icon.svg" height="64" width="64" />
      </div>
      <div class="row">
        <h1>Password Generator</h1>
      </div>
      <div class="row mx-3">
        <div class="fs-2 font-monospace text-break">
          <pg-password data-password>&nbsp;</pg-password>
        </div>
      </div>
      <div class="row mx-2 my-2">
        <div class="col">
          <pg-copy data-copy>
            <button id="copy" type="button" class="btn btn-secondary w-100">
              Copy
            </button>
          </pg-copy>
        </div>
        <div class="col">
          <button id="generate" type="button" class="btn btn-primary w-100">
            Generate
          </button>
        </div>
      </div>
      <div class="row mx-2 my-2">
        <div class="col-6">
          <div>
            Entropy:
            <pg-span data-watch="password" data-key="entropy"></pg-span> bits
          </div>
          <label for="length" class="form-label">
            Characters: <pg-span data-length></pg-span>
          </label>
          <pg-length data-input="length" />
        </div>
        <div class="col-6">
          <div class="form-check form-switch">
            <label class="form-check-label" for="lowercase">Lowercase</label>
            <pg-charsetcheckbox
              data-input="lower"
              data-watch="upper digit symbol"
              data-key="charsetsEnabled"
            />
          </div>
          <div class="form-check form-switch">
            <label class="form-check-label" for="uppercase">Uppercase</label>
            <pg-charsetcheckbox
              data-input="upper"
              data-watch="lower digit symbol"
              data-key="charsetsEnabled"
            />
          </div>
          <div class="form-check form-switch">
            <label class="form-check-label" for="digit">Digits</label>
            <pg-charsetcheckbox
              data-input="digit"
              data-watch="lower upper symbol"
              data-key="charsetsEnabled"
            />
          </div>
          <div class="form-check form-switch">
            <label class="form-check-label" for="symbol">Symbols</label>
            <pg-charsetcheckbox
              data-input="symbol"
              data-watch="lower upper digit"
              data-key="charsetsEnabled"
            />
          </div>
          <div class="form-check form-switch">
            <label class="form-check-label" for="symbol">Ambiguous</label>
            <pg-checkbox data-input="ambiguous" />
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
